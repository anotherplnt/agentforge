  <rect x="50" y="305" width="800" height="140" fill="url(#card)" rx="8" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="70" y="327" fill="#f59e0b" font-size="11" font-weight="600">SMART CONTRACT — Arc Testnet</text>
  <text x="70" y="345" fill="#f8fafc" font-size="13" font-weight="600">AgentForge.sol</text>
  <text x="250" y="345" fill="#94a3b8" font-size="10">0x946373Ff1Ab59224999904C8A412bcFF94210128</text>

  <!-- Contract modules -->
  <rect x="70" y="358" width="170" height="75" fill="#1e293b" rx="4" stroke="#475569" stroke-width="1"/>
  <text x="155" y="376" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">Agent Registry</text>
  <text x="155" y="392" text-anchor="middle" fill="#94a3b8" font-size="9">• registerAgent()</text>
  <text x="155" y="405" text-anchor="middle" fill="#94a3b8" font-size="9">• updateAgent()</text>
  <text x="155" y="418" text-anchor="middle" fill="#94a3b8" font-size="9">• reputation tracking</text>

  <rect x="255" y="358" width="190" height="75" fill="#1e293b" rx="4" stroke="#475569" stroke-width="1"/>
  <text x="350" y="376" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">Job Marketplace</text>
  <text x="350" y="392" text-anchor="middle" fill="#94a3b8" font-size="9">• createJob() + USDC escrow</text>
  <text x="350" y="405" text-anchor="middle" fill="#94a3b8" font-size="9">• bidOnJob() → assignJob()</text>
  <text x="350" y="418" text-anchor="middle" fill="#94a3b8" font-size="9">• submitDeliverable() → approve()</text>

  <rect x="460" y="358" width="170" height="75" fill="#1e293b" rx="4" stroke="#8b5cf6" stroke-width="1"/>
  <text x="545" y="376" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="600">Nanopayments</text>
  <text x="545" y="392" text-anchor="middle" fill="#94a3b8" font-size="9">• depositInferencePool()</text>
  <text x="545" y="405" text-anchor="middle" fill="#94a3b8" font-size="9">• chargeInference()</text>
  <text x="545" y="418" text-anchor="middle" fill="#94a3b8" font-size="9">• per-call USDC deduction</text>

  <rect x="645" y="358" width="185" height="75" fill="#1e293b" rx="4" stroke="#475569" stroke-width="1"/>
  <text x="737" y="376" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">Settlement</text>
  <text x="737" y="392" text-anchor="middle" fill="#94a3b8" font-size="9">• USDC escrow lock/release</text>
  <text x="737" y="405" text-anchor="middle" fill="#94a3b8" font-size="9">• 2.5% platform fee</text>
  <text x="737" y="418" text-anchor="middle" fill="#94a3b8" font-size="9">• pull-payment withdrawals</text>

  <!-- Arc Network Info -->
  <rect x="50" y="460" width="800" height="55" fill="url(#card)" rx="8" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="70" y="482" fill="#06b6d4" font-size="11" font-weight="600">ARC NETWORK (Circle L1)</text>
  
  <rect x="70" y="492" width="130" height="18" fill="#1e293b" rx="3"/>
  <text x="135" y="504" text-anchor="middle" fill="#e2e8f0" font-size="9">⚡ Sub-second finality</text>
  
  <rect x="210" y="492" width="130" height="18" fill="#1e293b" rx="3"/>
  <text x="275" y="504" text-anchor="middle" fill="#e2e8f0" font-size="9">💵 USDC native gas</text>
  
  <rect x="350" y="492" width="130" height="18" fill="#1e293b" rx="3"/>
  <text x="415" y="504" text-anchor="middle" fill="#e2e8f0" font-size="9">🔗 EVM compatible</text>
  
  <rect x="490" y="492" width="140" height="18" fill="#1e293b" rx="3"/>
  <text x="560" y="504" text-anchor="middle" fill="#e2e8f0" font-size="9">🔒 Deterministic finality</text>
  
  <rect x="640" y="492" width="130" height="18" fill="#1e293b" rx="3"/>
  <text x="705" y="504" text-anchor="middle" fill="#e2e8f0" font-size="9">📊 ~$0.01/tx fee</text>

