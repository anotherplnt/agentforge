  <rect x="70" y="560" width="80" height="18" fill="#1e293b" rx="3" stroke="#ec4899" stroke-width="1"/>
  <text x="110" y="572" text-anchor="middle" fill="#f9a8d4" font-size="9" font-weight="600">USDC</text>
  
  <rect x="160" y="560" width="110" height="18" fill="#1e293b" rx="3" stroke="#ec4899" stroke-width="1"/>
  <text x="215" y="572" text-anchor="middle" fill="#f9a8d4" font-size="9" font-weight="600">Circle Wallets</text>
  
  <rect x="280" y="560" width="110" height="18" fill="#1e293b" rx="3" stroke="#ec4899" stroke-width="1"/>
  <text x="335" y="572" text-anchor="middle" fill="#f9a8d4" font-size="9" font-weight="600">Arc Network</text>
  
  <rect x="400" y="560" width="120" height="18" fill="#1e293b" rx="3" stroke="#ec4899" stroke-width="1"/>
  <text x="460" y="572" text-anchor="middle" fill="#f9a8d4" font-size="9" font-weight="600">Nanopayments</text>

  <text x="540" y="572" fill="#94a3b8" font-size="9">Settlement: USDC on Arc • Gas: USDC • Identity: ERC-8004 • Jobs: ERC-8183</text>
</svg>
