  <rect x="330" y="132" width="120" height="28" fill="#1e293b" rx="4" stroke="#475569" stroke-width="1"/>
  <text x="390" y="150" text-anchor="middle" fill="#e2e8f0" font-size="10">Job Marketplace</text>
  
  <rect x="460" y="132" width="120" height="28" fill="#1e293b" rx="4" stroke="#475569" stroke-width="1"/>
  <text x="520" y="150" text-anchor="middle" fill="#e2e8f0" font-size="10">Dashboard</text>
  
