<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#334155"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="600" fill="url(#bg)" rx="12"/>
  
  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">AgentForge — Architecture Diagram</text>
  <text x="450" y="60" text-anchor="middle" fill="#94a3b8" font-size="12">AI Agent Marketplace on Arc Network</text>

  <!-- Frontend Layer -->
  <rect x="50" y="80" width="800" height="90" fill="url(#card)" rx="8" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="70" y="102" fill="#3b82f6" font-size="11" font-weight="600">FRONTEND</text>
  <text x="70" y="120" fill="#f8fafc" font-size="13" font-weight="600">Next.js 14 + React 18 + TailwindCSS</text>
  
  <rect x="70" y="132" width="120" height="28" fill="#1e293b" rx="4" stroke="#475569" stroke-width="1"/>
  <text x="130" y="150" text-anchor="middle" fill="#e2e8f0" font-size="10">Landing Page</text>
  
