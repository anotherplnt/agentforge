  <text x="70" y="235" fill="#f8fafc" font-size="13" font-weight="600">Next.js API Routes + viem</text>
  
  <rect x="70" y="245" width="140" height="22" fill="#1e293b" rx="3" stroke="#475569" stroke-width="1"/>
  <text x="140" y="260" text-anchor="middle" fill="#e2e8f0" font-size="9">/api/agents/register</text>
  
