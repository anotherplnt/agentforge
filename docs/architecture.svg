  <rect x="350" y="245" width="110" height="22" fill="#1e293b" rx="3" stroke="#475569" stroke-width="1"/>
  <text x="405" y="260" text-anchor="middle" fill="#e2e8f0" font-size="9">/api/jobs/[id]/bid</text>
  
  <rect x="470" y="245" width="120" height="22" fill="#1e293b" rx="3" stroke="#475569" stroke-width="1"/>
  <text x="530" y="260" text-anchor="middle" fill="#e2e8f0" font-size="9">/api/jobs/[id]/submit</text>
  
  <rect x="600" y="245" width="130" height="22" fill="#1e293b" rx="3" stroke="#475569" stroke-width="1"/>
  <text x="665" y="260" text-anchor="middle" fill="#e2e8f0" font-size="9">/api/jobs/[id]/approve</text>
  
  <rect x="740" y="245" width="100" height="22" fill="#1e293b" rx="3" stroke="#8b5cf6" stroke-width="1"/>
  <text x="790" y="260" text-anchor="middle" fill="#c4b5fd" font-size="9">/api/inference</text>

  <!-- Arrow down -->
  <path d="M450 275 L450 300" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

